<!doctype html>
<!--
  static/chat-test.html — ТЕСТОВАЯ СТРАНИЦА ЧАТА (этап 6).

  Зачем: Swagger не умеет проверять WebSocket. Эта страница — маленький «клиент»:
    1) входит (POST /auth/login) и получает access-токен;
    2) открывает WebSocket: ws://адрес/ws/chat?token=...;
    3) показывает список чатов, историю и новые сообщения в реальном времени.

  Как проверить «Анна и Иван говорят о погоде»:
    откройте http://127.0.0.1:8000/chat-test в ДВУХ окнах браузера
    (второе — в режиме инкогнито), войдите разными пользователями и пишите друг другу.

  Здесь только HTML + обычный JavaScript, никаких библиотек.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест чата</title>
  <style>
    /* Простые стили, чтобы было удобно смотреть */
    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f4f7; color: #1b1f2a; }
    header { padding: 12px 16px; background: #1b1f2a; color: #fff; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    header input, header button { padding: 6px 10px; font-size: 14px; }
    #status { margin-left: auto; font-size: 13px; }
    #notif { font-size: 13px; color: #ffd76a; }
    main { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 56px); }
    aside { border-right: 1px solid #d8dbe3; background: #fff; overflow: auto; }
    .chat-item { padding: 10px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
    .chat-item.active { background: #e7f0ff; }
    .chat-item small { color: #667; display: block; }
    .badge { background: #e23; color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; }
    .online { color: #19a35b; }
    section { display: flex; flex-direction: column; min-width: 0; }
    #messages { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 70%; padding: 8px 12px; border-radius: 14px; background: #fff; align-self: flex-start; }
    .msg.mine { background: #3b6cf6; color: #fff; align-self: flex-end; }
    .msg small { display: block; opacity: .7; font-size: 11px; }
    #typing { height: 18px; padding: 0 16px; font-size: 13px; color: #667; }
    form#send { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #d8dbe3; background: #fff; }
    form#send input { flex: 1; padding: 8px; }
    #log { font: 12px monospace; max-height: 120px; overflow: auto; background: #111; color: #9f9; padding: 6px 10px; margin: 0; }
  </style>
</head>
<body>
  <header>
    <input id="login" placeholder="username" value="">
    <input id="password" type="password" placeholder="пароль" value="">
    <button id="btnLogin">Войти</button>
    <input id="newChat" placeholder="написать кому (username)">
    <button id="btnNewChat">Начать чат</button>
    <span id="notif"></span>
    <span id="status">не подключено</span>
  </header>

  <main>
    <aside id="chats"></aside>
    <section>
      <div id="messages"></div>
      <div id="typing"></div>
      <form id="send"><input id="text" placeholder="Сообщение..." autocomplete="off"><button>Отправить</button></form>
      <pre id="log"></pre>
    </section>
  </main>

<script>
// ---------------------------------------------------------------------------
// Состояние страницы
// ---------------------------------------------------------------------------
let token = null;          // access-токен после входа
let me = null;             // мой username
let ws = null;             // открытое WebSocket-соединение
let currentChat = null;    // id открытого чата
let typingTimer = null;    // таймер, чтобы убрать надпись «печатает...»

const $ = (id) => document.getElementById(id);   // короткая запись getElementById

// log — показывает внизу всё, что пришло/ушло по WebSocket (для учёбы видно «сырые» JSON)
function log(direction, data) {
  $("log").textContent += direction + " " + JSON.stringify(data) + "\n";
  $("log").scrollTop = $("log").scrollHeight;
}

// api — обычный HTTP-запрос к нашему FastAPI с токеном в заголовке
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error(data?.detail || res.status);
  return data;
}

// ---------------------------------------------------------------------------
// 1. Вход: POST /auth/login (форма username + password, как в Swagger)
// ---------------------------------------------------------------------------
$("btnLogin").onclick = async () => {
  const res = await fetch("/auth/login", {
    method: "POST",
    body: new URLSearchParams({ username: $("login").value, password: $("password").value }),
  });
  const data = await res.json();
  if (!res.ok) { alert(data.detail); return; }
  token = data.access_token;
  me = $("login").value.trim().toLowerCase();
  connectWebSocket();
  loadChats();
};

// ---------------------------------------------------------------------------
// 2. WebSocket: ws://адрес/ws/chat?token=...
// ---------------------------------------------------------------------------
function connectWebSocket() {
  const protocol = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${protocol}://${location.host}/ws/chat?token=${encodeURIComponent(token)}`);

  ws.onopen = () => { $("status").textContent = "🟢 онлайн как " + me; };
  ws.onclose = () => { $("status").textContent = "🔴 отключено"; };

  // Сервер сам присылает события — это и есть «звонок», а не «письмо».
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    log("⬇", data);

    if (data.type === "message") {
      if (data.message.conversation_id === currentChat) {
        addMessage(data.message);
        send({ type: "read", conversation_id: currentChat });   // открыт этот чат → сразу прочитано
      }
      loadChats();   // обновить превью и счётчик непрочитанных
    }
    if (data.type === "typing" && data.conversation_id === currentChat) {
      $("typing").textContent = data.username + " печатает...";
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => { $("typing").textContent = ""; }, 2000);
    }
    if (data.type === "read") loadChats();
    // Этап 7: уведомление (лайк, комментарий, подписка) пришло по тому же WebSocket.
    if (data.type === "notification") $("notif").textContent = "🔔 " + data.notification.text;
    if (data.type === "error") alert(data.detail);
  };
}

// send — отправить событие по WebSocket (словарь → JSON-текст)
function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(data)); log("⬆", data); }
}

// ---------------------------------------------------------------------------
// 3. Список чатов: GET /chats
// ---------------------------------------------------------------------------
async function loadChats() {
  const chats = await api("GET", "/chats");
  $("chats").innerHTML = "";
  for (const chat of chats) {
    const div = document.createElement("div");
    div.className = "chat-item" + (chat.id === currentChat ? " active" : "");
    const last = chat.last_message ? chat.last_message.text : "нет сообщений";
    div.innerHTML = `<b></b> <span class="online">${chat.other_is_online ? "●" : ""}</span>
      ${chat.unread_count ? `<span class="badge">${chat.unread_count}</span>` : ""}<small></small>`;
    // textContent, а не innerHTML — чтобы чужой текст не выполнился как HTML (защита от XSS)
    div.querySelector("b").textContent = chat.other.username;
    div.querySelector("small").textContent = last;
    div.onclick = () => openChat(chat.id);
    $("chats").appendChild(div);
  }
}

// Начать чат: POST /chats {"username": "..."}
$("btnNewChat").onclick = async () => {
  try {
    const chat = await api("POST", "/chats", { username: $("newChat").value });
    await loadChats();
    openChat(chat.id);
  } catch (e) { alert(e.message); }
};

// ---------------------------------------------------------------------------
// 4. Открыть чат: история GET /chats/{id}/messages + «прочитано»
// ---------------------------------------------------------------------------
async function openChat(id) {
  currentChat = id;
  $("messages").innerHTML = "";
  const messages = await api("GET", `/chats/${id}/messages`);
  messages.forEach(addMessage);
  send({ type: "read", conversation_id: id });
  loadChats();
}

function addMessage(m) {
  const div = document.createElement("div");
  div.className = "msg" + (m.sender.username === me ? " mine" : "");
  div.textContent = m.text;
  const small = document.createElement("small");
  small.textContent = m.sender.username + " · " + new Date(m.created_at + "Z").toLocaleTimeString();
  div.appendChild(small);
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}

// ---------------------------------------------------------------------------
// 5. Отправка сообщения ПО WEBSOCKET и сигнал «печатаю»
// ---------------------------------------------------------------------------
$("send").onsubmit = (e) => {
  e.preventDefault();   // не перезагружать страницу
  const text = $("text").value.trim();
  if (!text || !currentChat) return;
  send({ type: "message", conversation_id: currentChat, text });
  $("text").value = "";
};

let lastTyping = 0;
$("text").oninput = () => {
  // Не чаще раза в секунду, чтобы не засыпать сервер событиями.
  if (currentChat && Date.now() - lastTyping > 1000) {
    send({ type: "typing", conversation_id: currentChat });
    lastTyping = Date.now();
  }
};
</script>
</body>
</html>
